[project]
name = "findmytakeover"
version = "3.1.0"
description = "Detect dangling DNS records vulnerable to subdomain takeover across AWS, GCP, Azure, Cloudflare, and Oracle Cloud."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Anirudh Biyani" }]

# Ranges, not pins: a pip install has to coexist with other packages. Each
# range stops before the next major (minor, for 0.x) release, since the cloud
# SDKs break APIs on those. requirements-lock.txt pins the exact set the Docker
# image and CI ship; regenerate it with:
#   uv pip compile pyproject.toml --universal --python-version 3.12 -o requirements-lock.txt
dependencies = [
    "click>=8.5.0,<9",
    "PyYAML>=6.0.3,<7",
    "pandas>=3.0.6,<4",
    "boto3>=1.43.114,<2",
    "google-cloud-dns>=0.37.2,<0.38",
    "google-auth>=2.62.0,<3",
    "google-cloud-resource-manager>=1.19.0,<2",
    "google-cloud-storage>=3.17.1,<4",
    "google-cloud-functions>=1.25.0,<2",
    "google-cloud-compute>=1.56.0,<2",
    "azure-mgmt-dns>=9.0.0,<10",
    "azure-identity>=1.26.0,<2",
    "azure-mgmt-subscription>=3.1.1,<4",
    "azure-mgmt-network>=33.1.0,<34",
    "azure-mgmt-cdn>=14.0.0,<15",
    "azure-mgmt-trafficmanager>=2.0.0,<3",
    "azure-mgmt-web>=11.0.1,<12",
    "azure-mgmt-storage>=25.3.0,<26",
    "azure-mgmt-apimanagement>=5.0.0,<6",
    "azure-mgmt-search>=9.2.0,<10",
    "azure-mgmt-containerinstance>=10.1.0,<11",
    "azure-mgmt-containerregistry>=15.0.0,<16",
    "azure-mgmt-redis>=14.5.0,<15",
    "azure-mgmt-sql>=4.0.0,<5",
    "cloudflare>=5.9.0,<6",
    "oci>=2.188.0,<3",
    "azure-mgmt-compute>=38.4.0,<40",
    "azure-mgmt-containerservice>=41.8.0,<42",
    "azure-mgmt-appcontainers>=5.1.0,<6",
    "azure-mgmt-cosmosdb>=10.0.0,<11",
    "dnspython>=2.9.0,<3",
    "google-cloud-run>=0.16.2,<0.17",
    "google-cloud-appengine-admin>=1.19.0,<2",
    "google-cloud-container>=2.67.0,<3",
    "google-cloud-artifact-registry>=1.23.0,<2",
    "requests>=2.34.2,<3",
]

[project.scripts]
findmytakeover = "findmytakeover:main"

[project.urls]
Homepage = "https://github.com/anirudhbiyani/findmytakeover"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["findmytakeover"]
packages = ["collector"]
