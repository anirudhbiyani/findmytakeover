[project]
name = "findmytakeover"
version = "2.0.0"
description = "Detect dangling DNS records vulnerable to subdomain takeover across AWS, GCP, Azure, Cloudflare, and Oracle Cloud."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Anirudh Biyani" }]

dependencies = [
    "click==8.4.2",
    "PyYAML==6.0.3",
    "pandas==3.0.5",
    "boto3==1.43.61",
    "google-cloud-dns==0.37.0",
    "google-auth==2.56.2",
    "google-cloud-resource-manager==1.18.0",
    "google-cloud-storage==3.10.1",
    "google-cloud-functions==1.24.0",
    "google-cloud-compute==1.50.0",
    "azure-mgmt-dns==9.0.0",
    "azure-identity==1.25.3",
    "azure-mgmt-resource==25.0.0",
    "azure-mgmt-subscription==3.1.1",
    "azure-mgmt-network==31.0.1",
    "azure-mgmt-cdn==13.1.1",
    "azure-mgmt-trafficmanager==1.1.0",
    "azure-mgmt-web==11.0.0",
    "azure-mgmt-storage==25.1.0",
    "azure-mgmt-apimanagement==5.0.0",
    "azure-mgmt-search==9.2.0",
    "azure-mgmt-containerinstance==10.1.0",
    "azure-mgmt-containerregistry==15.0.0",
    "azure-mgmt-redis==14.5.0",
    "azure-mgmt-sql==4.0.0",
    "cloudflare==5.6.0",
    "oci==2.182.0",
    "azure-mgmt-compute==38.2.0",
    "azure-mgmt-containerservice==41.5.0",
    "azure-mgmt-appcontainers==5.0.0",
    "azure-mgmt-cosmosdb==10.0.0",
    "dnspython==2.8.0",
    "google-cloud-run==0.16.1",
    "google-cloud-appengine-admin==1.18.0",
    "google-cloud-container==2.65.0",
    "google-cloud-artifact-registry==1.22.0",
    "requests==2.34.2",
]

[project.scripts]
findmytakeover = "findmytakeover:main"

[project.urls]
Homepage = "https://github.com/anirudhbiyani/findmytakeover"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["findmytakeover"]
packages = ["collector"]
