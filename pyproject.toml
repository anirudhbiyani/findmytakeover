[project]
name = "findmytakeover"
version = "2.0.0"
description = "Detect dangling DNS records vulnerable to subdomain takeover across AWS, GCP, Azure, Cloudflare, and Oracle Cloud."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Anirudh Biyani" }]

dependencies = [
    "click==8.5.0",
    "PyYAML==6.0.3",
    "pandas==3.0.6",
    "boto3==1.43.111",
    "google-cloud-dns==0.37.2",
    "google-auth==2.61.0",
    "google-cloud-resource-manager==1.19.0",
    "google-cloud-storage==3.17.0",
    "google-cloud-functions==1.25.0",
    "google-cloud-compute==1.56.0",
    "azure-mgmt-dns==9.0.0",
    "azure-identity==1.26.0",
    "azure-mgmt-resource==26.0.0",
    "azure-mgmt-subscription==3.1.1",
    "azure-mgmt-network==33.0.0",
    "azure-mgmt-cdn==14.0.0",
    "azure-mgmt-trafficmanager==2.0.0",
    "azure-mgmt-web==11.0.1",
    "azure-mgmt-storage==25.2.0",
    "azure-mgmt-apimanagement==5.0.0",
    "azure-mgmt-search==9.2.0",
    "azure-mgmt-containerinstance==10.1.0",
    "azure-mgmt-containerregistry==15.0.0",
    "azure-mgmt-redis==14.5.0",
    "azure-mgmt-sql==4.0.0",
    "cloudflare==5.9.0",
    "oci==2.187.2",
    "azure-mgmt-compute==38.4.0",
    "azure-mgmt-containerservice==41.7.0",
    "azure-mgmt-appcontainers==5.1.0",
    "azure-mgmt-cosmosdb==10.0.0",
    "dnspython==2.9.0",
    "google-cloud-run==0.16.2",
    "google-cloud-appengine-admin==1.19.0",
    "google-cloud-container==2.67.0",
    "google-cloud-artifact-registry==1.23.0",
    "requests==2.34.2",
]

[project.scripts]
findmytakeover = "findmytakeover:main"

[project.urls]
Homepage = "https://github.com/anirudhbiyani/findmytakeover"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["findmytakeover"]
packages = ["collector"]
