name: Docker

# Build (and smoke-test) the image whenever anything that affects it changes.
# On main, a version that isn't in GHCR yet is published there for amd64 and
# arm64 as ghcr.io/<owner>/findmytakeover:<version> and :latest.
on:
  push:
    branches: [main]
    paths: &img_paths
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - "findmytakeover.py"
      - "collector/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths: *img_paths

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        id: ver
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Image tag: findmytakeover:$version"

      - name: Build image
        run: docker build -t "findmytakeover:${{ steps.ver.outputs.version }}" .

      - name: Smoke test — entrypoint runs
        run: docker run --rm "findmytakeover:${{ steps.ver.outputs.version }}" --help

      - name: Smoke test — every cloud collector imports inside the image
        run: >-
          docker run --rm --entrypoint python
          "findmytakeover:${{ steps.ver.outputs.version }}"
          -c "import findmytakeover, collector.aws, collector.gcp, collector.msazure, collector.cloudflare, collector.oracle; print('imports ok')"

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR with the workflow token
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Published versions are immutable: an unbumped version is a no-op, like
      # the PyPI and GitHub release jobs.
      - name: Image name, and whether this version is already published
        id: meta
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "${image}:${version} is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.meta.outputs.publish == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.publish == 'true'

      - uses: docker/build-push-action@v6
        if: steps.meta.outputs.publish == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
