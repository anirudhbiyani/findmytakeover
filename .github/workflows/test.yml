name: Test

# The tool talks to five cloud providers, so the thing most likely to break a
# release is an import or packaging error, not the diff engine. This workflow
# therefore does three things: install the package the way a user would, prove
# every collector imports, and run the test suite.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version the container image ships, plus one release either side.
        python-version: ["3.12", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (doubles as a packaging smoke test)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Every cloud collector imports
        run: >-
          python -c "import findmytakeover,
          collector.aws, collector.gcp, collector.msazure,
          collector.cloudflare, collector.oracle; print('imports ok')"

      - name: CLI responds
        run: findmytakeover --help

      - name: Run tests
        run: |
          python -m pip install pytest "moto[apigateway,apigatewayv2,ec2,elb,elbv2,route53,s3,sts]"
          python -m pytest tests/ -v

  # The job above resolves the pyproject ranges fresh; this one installs the
  # exact set the container image ships. Dependabot edits lock lines without
  # re-resolving, so a bump another package's pin rules out fails here.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # the Dockerfile's

      - name: Install the lock the way the Dockerfile does
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps .
          python -m pip check

      - name: Run tests
        run: |
          python -m pip install pytest "moto[apigateway,apigatewayv2,ec2,elb,elbv2,route53,s3,sts]"
          python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Pyflakes rules only (unused imports, undefined names, f-string bugs).
      # These are real defects; style/line-length rules are deliberately left
      # out so lint failures always mean something is actually wrong.
      - name: Ruff (pyflakes rules)
        run: |
          python -m pip install ruff
          python -m ruff check --select F --exclude .claude .
